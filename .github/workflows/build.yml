  notify-completion:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [get-version, build-binary, upload-telegram]
    if: always()
    steps:
      - name: Workflow summary
        run: |
          echo "## Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Binary | ${{ needs.build-binary.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Upload Telegram | ${{ needs.upload-telegram.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.get-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY